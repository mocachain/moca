syntax = "proto3";
package moca.storage;

import "amino/amino.proto";
import "gogoproto/gogo.proto";

option go_package = "github.com/mocachain/moca/v2/x/storage/types";

// Params defines the parameters for the module.
message Params {
  option (amino.name) = "moca/x/storage/Params";
  option (gogoproto.goproto_stringer) = false;
  // 3-8 and 18-65 held the cross-chain mirror relayer fees.
  reserved 3 to 8, 18 to 65;
  reserved "bsc_mirror_bucket_relayer_fee", "bsc_mirror_bucket_ack_relayer_fee";
  reserved "bsc_mirror_object_relayer_fee", "bsc_mirror_object_ack_relayer_fee";
  reserved "bsc_mirror_group_relayer_fee", "bsc_mirror_group_ack_relayer_fee";
  reserved "op_mirror_bucket_relayer_fee", "op_mirror_bucket_ack_relayer_fee";
  reserved "op_mirror_object_relayer_fee", "op_mirror_object_ack_relayer_fee";
  reserved "op_mirror_group_relayer_fee", "op_mirror_group_ack_relayer_fee";
  reserved "polygon_mirror_bucket_relayer_fee", "polygon_mirror_bucket_ack_relayer_fee";
  reserved "polygon_mirror_object_relayer_fee", "polygon_mirror_object_ack_relayer_fee";
  reserved "polygon_mirror_group_relayer_fee", "polygon_mirror_group_ack_relayer_fee";
  reserved "scroll_mirror_bucket_relayer_fee", "scroll_mirror_bucket_ack_relayer_fee";
  reserved "scroll_mirror_object_relayer_fee", "scroll_mirror_object_ack_relayer_fee";
  reserved "scroll_mirror_group_relayer_fee", "scroll_mirror_group_ack_relayer_fee";
  reserved "linea_mirror_bucket_relayer_fee", "linea_mirror_bucket_ack_relayer_fee";
  reserved "linea_mirror_object_relayer_fee", "linea_mirror_object_ack_relayer_fee";
  reserved "linea_mirror_group_relayer_fee", "linea_mirror_group_ack_relayer_fee";
  reserved "mantle_mirror_bucket_relayer_fee", "mantle_mirror_bucket_ack_relayer_fee";
  reserved "mantle_mirror_object_relayer_fee", "mantle_mirror_object_ack_relayer_fee";
  reserved "mantle_mirror_group_relayer_fee", "mantle_mirror_group_ack_relayer_fee";
  reserved "arbitrum_mirror_bucket_relayer_fee", "arbitrum_mirror_bucket_ack_relayer_fee";
  reserved "arbitrum_mirror_object_relayer_fee", "arbitrum_mirror_object_ack_relayer_fee";
  reserved "arbitrum_mirror_group_relayer_fee", "arbitrum_mirror_group_ack_relayer_fee";
  reserved "optimism_mirror_bucket_relayer_fee", "optimism_mirror_bucket_ack_relayer_fee";
  reserved "optimism_mirror_object_relayer_fee", "optimism_mirror_object_ack_relayer_fee";
  reserved "optimism_mirror_group_relayer_fee", "optimism_mirror_group_ack_relayer_fee";
  reserved "base_mirror_bucket_relayer_fee", "base_mirror_bucket_ack_relayer_fee";
  reserved "base_mirror_object_relayer_fee", "base_mirror_object_ack_relayer_fee";
  reserved "base_mirror_group_relayer_fee", "base_mirror_group_ack_relayer_fee";
  VersionedParams versioned_params = 1 [(gogoproto.nullable) = false, (amino.dont_omitempty) = true];

  // max_payload_size is the maximum size of the payload, default: 2G
  uint64 max_payload_size = 2;
  // The maximum number of buckets that can be created per account
  uint32 max_buckets_per_account = 9;
  // The window to count the discontinued objects or buckets
  uint64 discontinue_counting_window = 10;
  // The max objects can be requested in a window
  uint64 discontinue_object_max = 11;
  // The max buckets can be requested in a window
  uint64 discontinue_bucket_max = 12;
  // The object will be deleted after the confirm period in seconds
  int64 discontinue_confirm_period = 13;
  // The max delete objects in each end block
  uint64 discontinue_deletion_max = 14;
  // The max number for deleting policy in each end block
  uint64 stale_policy_cleanup_max = 15;
  // The min interval for making quota smaller in seconds
  uint64 min_quota_update_interval = 16;
  // the max number of local virtual group per bucket
  uint32 max_local_virtual_group_num_per_bucket = 17;
}

// VersionedParams defines the parameters for the storage module with multi version, each version store with different timestamp.
message VersionedParams {
  option (gogoproto.goproto_stringer) = false;

  // max_segment_size is the maximum size of a segment. default: 16M
  uint64 max_segment_size = 1;
  // redundant_data_check_num is the num of data chunks of EC redundancy algorithm
  uint32 redundant_data_chunk_num = 2;
  // redundant_data_check_num is the num of parity chunks of EC redundancy algorithm
  uint32 redundant_parity_chunk_num = 3;
  // min_charge_size is the minimum charge size of the payload, objects smaller than this size will be charged as this size
  uint64 min_charge_size = 4;
}
