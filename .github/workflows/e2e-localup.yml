name: E2E Localup Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

env:
  CGO_CFLAGS: "-O -D__BLST_PORTABLE__"
  CGO_CFLAGS_ALLOW: "-O -D__BLST_PORTABLE__"

jobs:
  e2e-localup:
    name: EVM/precompile e2e (localup)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10"

      - name: Build mocad
        run: make build

      - name: Start local devnet (1 validator, 7 SPs)
        run: |
          cd deployment/localup
          bash localup.sh all 1 7
          bash localup.sh export_sps 1 7

      - name: Wait for chain liveness
        run: |
          for _ in $(seq 1 30); do
            if curl -s --max-time 5 -X POST -H "Content-Type: application/json" \
              --data '{"jsonrpc":"2.0","method":"eth_blockNumber","params":[],"id":1}' \
              http://127.0.0.1:8545 | grep -q result; then
              echo "chain is live"
              exit 0
            fi
            sleep 2
          done
          echo "chain never became live"
          exit 1

      - name: Run e2e/tests suite
        run: go test ./e2e/tests/... -v -count=1 -timeout 10m

      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1

      # sdk/client's tests all sign as this one well-known private key
      # (sdk/client/test/config.go's TestPrivateKey); it isn't a genesis
      # account on a fresh localup chain, so fund it here rather than
      # changing the test suite itself. The sending key is localup.sh's own
      # hardcoded local-devnet dev account (devaccount_prikey), pre-funded
      # at genesis for every localup chain purely for test purposes -- not
      # a secret.
      - name: Fund sdk/client's test account
        run: |
          cast send 0xF03Af05bE1a3ADF6Df23E7ee9A151718284FAE1a \
            --value 1000ether \
            --rpc-url http://127.0.0.1:8545 \
            --private-key 0x2228e392584d902843272c37fd62b8c73c10c81a5ecb901773c9ebe366e937bb

      # fail on any failure not in sdk/client/known_failures.txt, on a listed test that passes, or on a panic; -count=1 forbids cached results
      - name: Run sdk/client tests
        run: |
          results="$RUNNER_TEMP/sdk-client-test.json"
          status=0
          go test ./sdk/client/... -json -count=1 -timeout 5m > "$results" || status=$?
          jq -j 'select(.Action == "output" or .Action == "build-output") | .Output' "$results"
          known=$(sed -E 's/[[:space:]]*#.*//; /^[[:space:]]*$/d' sdk/client/known_failures.txt | jq -R . | jq -sc .)
          problems=$(jq -rs --argjson known "$known" --arg status "$status" '
            def tests($a): [.[] | select(.Test != null and .Action == $a) | .Test] | unique;
            def pkgs($a; $t): [.[] | select((.Test != null) == $t and .Action == $a) | .Package] | unique;
            tests("fail") as $failed | tests("pass") as $passed | [
              (if ($passed | length) == 0 then "no test passed, did the tests run?" else empty end),
              (if ($failed | length) == 0 and $status != "0" then "go test exited \($status) without a failing test" else empty end),
              (($failed - $known)[] | "unexpected failure: \(.)"),
              (($known - ($known - $passed))[] | "known failure now passes, remove it from known_failures.txt: \(.)"),
              (($known - $failed - $passed)[] | "known failure did not run: \(.)"),
              ((pkgs("fail"; false) - pkgs("fail"; true))[] | "package failed without a failing test: \(.)"),
              (.[] | select(.Action == "output" and ((.Output // "") | startswith("panic:"))) | "panic in \(.Package): \(.Output | rtrimstr("\n"))")
            ] | .[]' "$results")
          jq -r --argjson known "$known" 'select(.Action == "fail" and .Test != null and (.Test | IN($known[]))) | "::warning title=known sdk/client failure::\(.Test)"' "$results"
          if [ -n "$problems" ]; then
            while IFS= read -r problem; do echo "::error title=sdk/client tests::$problem"; done <<< "$problems"
            exit 1
          fi

      - name: Collect chain logs
        if: failure()
        run: |
          mkdir -p /tmp/e2e-localup-logs
          cp deployment/localup/.local/validator0/logs/node.log /tmp/e2e-localup-logs/ 2>/dev/null || true
          cp -r deployment/localup/.local/logs /tmp/e2e-localup-logs/session-logs 2>/dev/null || true
          cp deployment/localup/.local/sp_export.json /tmp/e2e-localup-logs/ 2>/dev/null || true

      - name: Upload chain logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-localup-logs
          path: /tmp/e2e-localup-logs
          retention-days: 7

      - name: Stop devnet
        if: always()
        run: |
          cd deployment/localup
          bash localup.sh stop || true
